  b.style.setProperty('--sr',Math.round(n.r*31+i*47)%360+'deg');
  b.setAttribute('aria-label','Open when '+smart(n.k));
  b.innerHTML='<span class="back"></span><span class="slip"></span><span class="front"><span class="lbl"></span></span>'+FOLDS+'<span class="flap"></span><span class="seal">'+sealSVG(n.h,i)+'</span>';
  b.querySelector('.lbl').textContent=smart(n.k);
  if(read.has(n.k)) b.classList.add('read');
  if(friday && n.k==="it's Friday") b.classList.add('today');
  if(birthday && n.k==="it's your birthday") b.classList.add('today');
  b.addEventListener('click',()=>openNote(i,b));
  grid.appendChild(b);
});
const syncReseal=()=>{ $('reseal').hidden=read.size===0; };
syncReseal();
/* A link ending in #birthday opens the birthday letter straight away. */
if(location.hash==='#birthday') setTimeout(()=>openNote(0,grid.children[0]), calm?0:500);

function openNote(i,b){
  if(busy) return;
  busy=true; current=b;
  b.classList.add('opening');
  setTimeout(()=>show(N[i]), calm?0:620);
}
function show(n){
  $('ar').textContent=n.ar;
  $('tr').textContent=smart(n.tr);
  $('ref').textContent=smart(n.ref);
  $('lt').textContent='Open when '+smart(n.k);
  const ps=$('ps'); ps.textContent='';
  if(n.poem){
    ps.appendChild(el('h3','pt',smart(n.title)));
    n.poem.forEach(s=>{
      const p=el('p','st');
      s.split('\n').forEach(l=>p.appendChild(el('span','ln',smart(l))));
      ps.appendChild(p);
    });
  }else{
    n.p.forEach(t=>ps.appendChild(el('p','',smart(t))));
  }
  $('say').textContent=smart(n.say);
  $('mean').textContent=smart(n.mean);
  count=0; paintCount(false);
  clearTimeout(hideTimer);
  veil.classList.remove('hide');
  veil.classList.add('show');
  veil.scrollTop=0;
  document.documentElement.style.overflow='hidden';
  main.inert=true;
  isOpen=true;
  letter.focus({preventScroll:true});
  read.add(n.k); store.set([...read]);
  /* Lets the phone's back button or back swipe close the letter instead of leaving the page. */
  pushed=false;
  if(window.top===window){ try{ history.pushState({letter:1},''); pushed=true; }catch(e){} }
}
function finishClose(){
  if(!isOpen) return;
  isOpen=false; pushed=false;
  main.inert=false;
  document.documentElement.style.overflow='';
  const done=()=>{ veil.classList.remove('show','hide'); };
  if(calm) done(); else { veil.classList.add('hide'); hideTimer=setTimeout(done,200); }
  if(current){ current.classList.remove('opening'); current.classList.add('read'); current.focus({preventScroll:true}); }
  syncReseal();
  busy=false;
}
function closeNote(){
  if(!isOpen) return;
  if(pushed){
    try{ history.back(); }catch(e){ finishClose(); return; }
    setTimeout(finishClose,350);            /* in case the browser never reports the step back */
  }else finishClose();
}
addEventListener('popstate',finishClose);

function paintCount(pulse){
  $('n').textContent=count;
  const inRound=count===0?0:((count-1)%ROUND)+1, rounds=Math.floor(count/ROUND);
  const prog=$('prog');
  prog.style.transition=(inRound<=1)?'none':'';
  prog.style.strokeDashoffset=ROUND-inRound;
  $('hint').textContent=count===0?'Tap to count':rounds===0?'of '+ROUND:rounds===1?'1 round of '+ROUND:rounds+' rounds of '+ROUND;
  const box=$('ringbox');
  box.classList.remove('full');
  if(pulse && inRound===ROUND){
    void box.offsetWidth; box.classList.add('full');
    if(navigator.vibrate) try{ navigator.vibrate(40); }catch(e){}
  }
}
$('bead').addEventListener('click',()=>{ count++; paintCount(true); });

$('pick').addEventListener('click',()=>{
  if(busy) return;
  const skip=["it's your birthday","it's Friday","you had a good day"];
  const all=N.map((n,i)=>i).filter(i=>!skip.includes(N[i].k));
  const unread=all.filter(i=>!grid.children[i].classList.contains('read'));
  const pool=unread.length?unread:all;
  const i=pool[Math.floor(Math.random()*pool.length)];
  const e=grid.children[i];
  busy=true;
  e.scrollIntoView({block:'center',behavior:calm?'auto':'smooth'});
  setTimeout(()=>{ busy=false; openNote(i,e); }, calm?0:450);
});
$('reseal').addEventListener('click',()=>{
  read.clear(); store.set([]);
  [...grid.children].forEach(c=>c.classList.remove('read'));
  syncReseal();
  $('pick').focus({preventScroll:true});
});
$('fold').addEventListener('click',closeNote);
$('x').addEventListener('click',closeNote);
veil.addEventListener('click',e=>{ if(e.target===veil) closeNote(); });
document.addEventListener('keydown',e=>{
  if(!isOpen) return;
  if(e.key==='Escape'){ closeNote(); return; }
  if(e.key==='Tab'){                        /* keep keyboard focus inside the open letter */
    const f=[...letter.querySelectorAll('button')], first=f[0], last=f[f.length-1], a=document.activeElement;
    if(e.shiftKey && (a===first || a===letter)){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && a===last){ e.preventDefault(); first.focus(); }
  }
});
</script>
</body>
